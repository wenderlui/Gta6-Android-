name: Tema Android (Neon Shore)

on:
  push:
    paths:
      - "theme-android/**"
      - ".github/workflows/theme-android.yml"
  pull_request:
    paths:
      - "theme-android/**"
      - ".github/workflows/theme-android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: theme-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Preparar chave de upload (se configurada)
        env:
          KEYSTORE_BASE64: ${{ secrets.NEON_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "NEON_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "Chave de upload encontrada: o AAB sairá assinado."
          else
            echo "::warning::Segredo NEON_KEYSTORE_BASE64 não configurado: o AAB sairá sem assinatura."
          fi

      - name: Gerar AAB e APK
        env:
          NEON_KEYSTORE_PASSWORD: ${{ secrets.NEON_KEYSTORE_PASSWORD }}
          NEON_KEY_ALIAS: ${{ secrets.NEON_KEY_ALIAS }}
          NEON_KEY_PASSWORD: ${{ secrets.NEON_KEY_PASSWORD }}
          NEON_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew --no-daemon bundleRelease assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: neon-shore-release-aab
          path: theme-android/app/build/outputs/bundle/release/*.aab

      - uses: actions/upload-artifact@v4
        with:
          name: neon-shore-debug-apk
          path: theme-android/app/build/outputs/apk/debug/*.apk
