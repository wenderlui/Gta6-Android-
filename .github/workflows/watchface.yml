name: Watch face (Wear OS)

on:
  push:
    paths:
      - "watchface/**"
      - ".github/workflows/watchface.yml"
  pull_request:
    paths:
      - "watchface/**"
      - ".github/workflows/watchface.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: watchface
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # The ubuntu-latest image ships the Android SDK in $ANDROID_HOME;
      # AGP downloads any missing platform automatically.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Validate watchface.xml (Watch Face Format v1)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/wff
          gh release download --repo google/watchface --pattern '*validator*.jar' --dir /tmp/wff
          JAR=$(ls /tmp/wff/*.jar | head -1)
          echo "Using $JAR"
          java -jar "$JAR" 1 app/src/main/res/raw/watchface.xml

      - name: Decode upload keystore
        env:
          KEYSTORE_B64: ${{ secrets.WATCHFACE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "WATCHFACE_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "Release bundle will be signed."
          else
            echo "::warning::WATCHFACE_KEYSTORE_BASE64 secret not set; the release bundle will be unsigned."
          fi

      - name: Build bundle (AAB) and debug APK
        env:
          WATCHFACE_KEYSTORE_PASSWORD: ${{ secrets.WATCHFACE_KEYSTORE_PASSWORD }}
          WATCHFACE_KEY_ALIAS: ${{ secrets.WATCHFACE_KEY_ALIAS }}
          WATCHFACE_KEY_PASSWORD: ${{ secrets.WATCHFACE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon bundleRelease assembleDebug

      - name: Check bundle contents
        run: |
          AAB=app/build/outputs/bundle/release/app-release.aab
          unzip -l "$AAB" | grep -E "base/res/raw/watchface.xml|base/manifest/AndroidManifest.xml"
          if unzip -l "$AAB" | grep -q "\.dex"; then echo "::error::bundle contains dex"; exit 1; fi
          APK=app/build/outputs/apk/debug/app-debug.apk
          if unzip -l "$APK" | grep -q "\.dex"; then echo "::error::debug APK contains dex"; exit 1; fi

      - uses: actions/upload-artifact@v5
        with:
          name: neon-beach-watchface
          path: |
            watchface/app/build/outputs/bundle/release/app-release.aab
            watchface/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
