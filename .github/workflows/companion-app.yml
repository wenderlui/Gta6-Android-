name: App companheiro (build)

on:
  push:
    paths: ["companion-app/**", ".github/workflows/companion-app.yml"]
  pull_request:
    paths: ["companion-app/**", ".github/workflows/companion-app.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: companion-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Preparar chave de assinatura (se configurada)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "SIGNING_STORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "Assinatura de release configurada."
          else
            echo "::warning::Secret KEYSTORE_BASE64 ausente: o AAB sairá sem assinatura."
          fi

      - name: Build (APK debug + AAB release)
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew --no-daemon assembleDebug bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: neonguia-release-aab
          path: companion-app/app/build/outputs/bundle/release/*.aab
      - uses: actions/upload-artifact@v4
        with:
          name: neonguia-debug-apk
          path: companion-app/app/build/outputs/apk/debug/*.apk

  screenshots:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: neonguia-debug-apk
          path: apk
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capturar telas no emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r apk/*.apk
            mkdir -p play-store/capturas
            adb shell settings put system time_12_24 24
            adb shell cmd uimode night yes
            for t in 0 1 2 3 4; do adb shell am start -S -W -n com.wenderlui.neonguia/.MainActivity --ei tab $t; sleep 6; adb exec-out screencap -p > play-store/capturas/tela-$t.png; done
      - uses: actions/upload-artifact@v4
        with:
          name: neonguia-screenshots
          path: play-store/capturas/*.png
      - name: Salvar capturas no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add play-store/capturas
          git diff --cached --quiet || (git commit -m "Atualiza capturas de tela da Play Store" && git push)
